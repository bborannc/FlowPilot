# ==========================================
# Application Configuration
# ==========================================
spring.application.name=FlowPilot

# ==========================================
# Database Connection Settings (PostgreSQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/dynamic_approval_db
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
# Tablo yönetimini Flyway üstlendiği için Hibernate'in ddl-auto özelliğini 'validate' yapıyoruz.
# Hibernate tabloları sıfırdan üretmez, Flyway'in oluşturduğu şema ile Entity'leri doğrular.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# Flyway Migration Configuration
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
# Flyway'in PostgreSQL versiyon uyuşmazlığını yok saymasını sağlar
spring.flyway.postgresql.transactional-lock=false